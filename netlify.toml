[build]
  command = "npm run build"
  publish = "dist"

# ── En-têtes de sécurité ─────────────────────────────────────────────────
# Ils sont écrits au build dans `dist/_headers` (greffon `pagesStatiques`,
# `vite.config.ts`) parce que la CSP autorise le script en ligne de
# préchargement par son empreinte SHA-256, calculée sur le HTML produit.

# ── En-têtes de cache ────────────────────────────────────────────────────
# Netlify pose déjà `immutable` sur `/assets/*`, que Vite nomme par
# empreinte. Il ne le pose PAS sur `public/`, qu'il recopie tel quel : les
# images et les fontes y repartaient donc en revalidation à chaque visite.
#
# Les deux dossiers ci-dessous portent pourtant un nom stable PAR
# CONSTRUCTION, et c'est le socle qui l'organise :
#   · `/img/*`   — grammaire `arc-<domaine>-<sujet>-<format>-v<NN>.<ext>`
#     (§ 0.19). « Le numéro de version ne recule jamais : une image corrigée
#     après publication passe en -v02 et le nom change, ce qui suffit à
#     casser les caches. » Un fichier de ce dossier ne change JAMAIS de
#     contenu sous le même nom — c'est exactement la définition d'`immutable`.
#   · `/fonts/*` — auto-hébergées (§ 0.32), préchargées par `index.html`, et
#     figées : une fonte ne se corrige pas, elle se remplace.
#
# Un an, la valeur maximale que les navigateurs honorent en pratique.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── Renvois — socle § 0.27 ───────────────────────────────────────────────
# L'ORDRE COMPTE : Netlify applique la première règle qui correspond. Il n'y
# a plus d'attrape-tout : une URL inconnue reçoit `404.html` en vrai 404.
#
# Ces règles ne voient que les chargements de page complets. Une navigation
# interne (`<Link>`) est résolue par le routeur, jamais par le réseau : les
# mêmes renvois sont donc écrits une seconde fois dans `src/App.tsx`, et les
# deux listes doivent rester d'accord.

# Permanent — le § 0.27 l'impose depuis l'existant. Il reste quand la page
# de paliers sera écrite.
[[redirects]]
  from = "/paliers"
  to = "/laboratoire/paliers"
  status = 301

# TEMPORAIRES — à retirer dès que les deux pages existent.
# Le § 0.27 déclare `/laboratoire/paliers` publique ET indexée : un 301
# poisonnerait l'index et les caches le jour où elle est écrite. `/formation`
# porte déjà le contenu des deux vues — la notice du Module 01 avec son
# sommaire, puis les trois paliers avec leur comparatif.
[[redirects]]
  from = "/laboratoire/paliers"
  to = "/formation"
  status = 302

[[redirects]]
  from = "/formation/module-01"
  to = "/formation"
  status = 302

# ── Pages servies ────────────────────────────────────────────────────────
# Le build écrit un HTML par route (`vite.config.ts`, greffon
# `pagesStatiques`) : même application, mais une tête de page propre à la
# route, pour les robots et les aperçus de lien qui n'exécutent pas JS.
# Netlify les sert déjà sans règle ; les réécritures ci-dessous ne font que
# couvrir aussi la variante avec barre oblique finale.

[[redirects]]
  from = "/formation"
  to = "/formation.html"
  status = 200

[[redirects]]
  from = "/minecraft"
  to = "/minecraft.html"
  status = 200

[[redirects]]
  from = "/discord"
  to = "/discord.html"
  status = 200

[[redirects]]
  from = "/reseaux"
  to = "/reseaux.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/mentions-legales"
  to = "/mentions-legales.html"
  status = 200

[[redirects]]
  from = "/cgv"
  to = "/cgv.html"
  status = 200

[[redirects]]
  from = "/confidentialite"
  to = "/confidentialite.html"
  status = 200

# ── Page introuvable ─────────────────────────────────────────────────────
# PLUS D'ATTRAPE-TOUT EN 200. Toute URL qui ne correspond ni à un fichier ni
# à une règle reçoit `404.html` (écrit au build, `noindex`, sans canonique)
# avec un VRAI statut 404 : c'est le comportement natif de Netlify. L'appli
# React s'y monte et rend `NotFound`, comme avant.
