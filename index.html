<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Socle § 0.29 : #2A2F32 (--acier-900) remplace le #16130D de l'ancienne charte. -->
    <meta name="theme-color" content="#2A2F32" />

    <!-- La charte mesure 126 paires de contraste (charte/reference/matrice-contraste.md)
         et arbitre chaque valeur au centième. Une extension qui réinverse la page
         détruit ce travail en silence : le verrou était déjà posé dans la maquette
         validée, il est repris ici. Le site n'a pas de thème sombre système — le
         contexte sombre est porté par la seule classe `.acier` (socle § 0.11). -->
    <meta name="darkreader-lock" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://archivesprofesseurchen.com/" />

    <title>Les Archives du Professeur Chen</title>
    <meta
      name="description"
      content="Une formation à la création de contenu, une communauté Discord, un serveur Minecraft Cobblemon et des vidéos, tenus comme on tient des archives."
    />

    <!-- Socle § 0.29 : og:title et og:description sont identiques au title
         et à la description. Le titre de l'accueil est le nom seul. -->
    <meta property="og:title" content="Les Archives du Professeur Chen" />
    <meta
      property="og:description"
      content="Une formation à la création de contenu, une communauté Discord, un serveur Minecraft Cobblemon et des vidéos, tenus comme on tient des archives."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:site_name" content="Les Archives du Professeur Chen" />
    <meta property="og:url" content="https://archivesprofesseurchen.com/" />
    <!-- LA CARTE DE PARTAGE — § 0.29 et 07-imagerie § 7.10.1 (`ARC · FMT — 08`).
         « og:image : arc-og-<page>-1200x630-vNN.jpg, JPEG obligatoire » ; et
         le § 7.10.1 dit pourquoi : « ARC · FMT — 08 est en JPEG, pas en AVIF
         ni en WebP : beaucoup d'aspirateurs de métadonnées sociales ne
         décodent pas ces formats et n'afficheraient aucune vignette ».
         La référence pointait sur `favicon.svg` — un SVG, qu'AUCUN des
         aspirateurs de X, Facebook, LinkedIn, Discord, WhatsApp et Slack ne
         rend : tout lien partagé du site sortait sans vignette.

         ELLE EST DÉCLARÉE ICI, ET NON PAR PAGE, PARCE QUE LES ASPIRATEURS
         N'EXÉCUTENT PAS DE JAVASCRIPT. `useMetaPage` pose bien un `og:title`
         et un `og:description` par route, mais il les pose APRÈS le montage
         de React : un aspirateur ne voit jamais que ce fichier. Servir une
         carte par page demanderait un pré-rendu, qui n'est pas une décision
         de recette. Une carte, celle de l'accueil, pour toutes les routes.

         Composition — § 7.10.3 : « sur les cartes OG, le texte est toujours
         composé en HTML/CSS ou en design par-dessus l'image ». Le nom du
         site n'y est PAS recomposé : il est dans la photo, en néon, et A1.2
         n'admet qu'une enseigne par écran. La plaque porte l'offre, sur
         `--scrim-og rgba(58,17,24,.90)` mesuré 11,44:1 par le chapitre 07.
         Recette : `outils/carte-og.mjs`. Poids 147 ko, plafond 300 ko. -->
    <meta property="og:image" content="https://archivesprofesseurchen.com/img/arc-og-accueil-1200x630-v01.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Le narrateur, de dos, travaille à la paillasse ovale du laboratoire, sous l'enseigne au néon des Archives." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://archivesprofesseurchen.com/img/arc-og-accueil-1200x630-v01.jpg" />

    <!-- Fontes auto-hébergées — plus aucun appel à googleapis.com ni à
         gstatic.com (§ 0.32). Les @font-face sont dans
         src/styles/00-fontes.css ; on précharge les deux faces que toute
         page emploie, parce qu'elles ne sont découvertes qu'après le
         téléchargement de la feuille. -->
    <link rel="preload" href="/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/fraunces-roman.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="subject" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="object" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form name="newsletter" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="email" name="email" />
      <input type="text" name="bot-field" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
